name: Wrath++ looks

# Shadowlands' looks (9.2.7.45745) for the ten races of 3.3.5, for Wrath++ alone
# (docs/wrathpp/SHADOWLANDS_OPTIONS.md): realm/warcraft/wrathpp/tools/sl_looks.py reads the game's tables
# (wago.tools' CSVs), fetches the ten races' models and textures by file id (wago.tools), converts them with the allied
# races' converter (realm/warcraft/modules/mod-allied-races/tools) and writes the character tables over the server's
# own (server-data.env's data.zip: its dbc folder). Blizzard's files: never in the repository. Published from main as
# the release wrathpp-looks (wrathpp-looks.zip and .json), which the app puts in Wrath++'s copy of the game
# (Data/patch-Z.MPQ) and its server (share/dbc): WrathppLooks.kt.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wrathpp-looks.yml
      - realm/warcraft/wrathpp/tools/sl_looks.py
      - realm/warcraft/wrathpp/tools/sl_creator.py
      - realm/warcraft/wrathpp/tools/sl_skin_names.py
      - realm/warcraft/wrathpp/data/skin_names.json
      - realm/warcraft/wrathpp/tools/sl_inventory.py
      - realm/warcraft/wrathpp/tools/sl_ui_art.py
      - realm/warcraft/wrathpp/tools/body_icon.py
      - realm/warcraft/wrathpp/client-mod/rig/**
      - app/src/main/assets/wrathpp/WrathppCreate.lua
      - realm/warcraft/modules/mod-allied-races/tools/m2.py
      - realm/warcraft/modules/mod-allied-races/tools/races.py
      - realm/warcraft/modules/mod-allied-races/tools/textures.py
      - realm/warcraft/modules/mod-allied-races/tools/names.py
      - realm/warcraft/modules/mod-allied-races/tools/blp.py
      - realm/warcraft/modules/mod-allied-races/tools/decimate.py
      - realm/warcraft/modules/mod-allied-races/tools/check_m2.py

permissions:
  contents: write
  issues: read          # the rig reads the game's own creation screen from the phone's reports (rig/tools/fetch_stock.sh)

concurrency:
  group: wrathpp-looks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  looks:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-numpy python3-pil unzip zip luajit

      - name: The server's tables (data.zip's dbc)
        run: |
          . realm/warcraft/server-data.env
          curl -fsSL --retry 4 -o data.zip "$SERVER_DATA_URL"
          echo "$SERVER_DATA_SHA256  data.zip" | sha256sum -c -
          unzip -q -o data.zip 'dbc/CharSections.dbc' 'dbc/CharHairGeosets.dbc' 'dbc/CharacterFacialHairStyles.dbc' -d server-data
          # (and what the rig's game needs of the game's own: the races, the classes, which race may be which class)
          unzip -q -o data.zip 'dbc/ChrRaces.dbc' 'dbc/ChrClasses.dbc' 'dbc/CharBaseInfo.dbc' 'dbc/FactionTemplate.dbc' 'dbc/FactionGroup.dbc' 'dbc/ItemDisplayInfo.dbc' 'dbc/SpellIcon.dbc' -d rig-dbc
          rm data.zip
          ls -l server-data/dbc

      - name: The game's tables of today
        run: python3 realm/warcraft/wrathpp/tools/sl_looks.py fetch build/sl-csv

      - name: What each race is made of
        run: python3 realm/warcraft/wrathpp/tools/sl_looks.py races build/sl-csv build/looks.json | tee looks-report.txt

      - uses: actions/cache@v4
        with:
          path: build/sl-cache
          key: wrathpp-looks-files-${{ hashFiles('build/looks.json') }}
          restore-keys: wrathpp-looks-files-

      - name: Models and textures
        run: |
          python3 realm/warcraft/wrathpp/tools/sl_looks.py package build/looks.json build/sl-cache server-data/dbc build/looks 2>&1 | tee package.log
          [ -f build/looks/looks.files ]

      # What the creator shows a race and sex (Shadowlands' options, their choices, their place in 3.3.5's five numbers):
      # with the looks, since it is the key to their tables.
      - name: The creator's options
        run: |
          python3 realm/warcraft/wrathpp/tools/sl_creator.py data build/sl-csv build/looks.json build/looks/client/Interface/GlueXML/WrathppLooks.lua | tee -a looks-report.txt
          echo 'Interface\GlueXML\WrathppLooks.lua' >> build/looks/looks.files

      # Shadowlands' creator's own art (the pieces its creation screens are drawn from, cut out of the game's interface
      # sheets at 9.2.7 by file id: wago.tools), each a file 3.3.5 reads, and the table that names them. A package of its
      # own (some 8 MB), so that a change to the creator's art is not the looks' 400 MB again.
      - name: Shadowlands' creator art
        run: |
          python3 realm/warcraft/wrathpp/tools/sl_ui_art.py fetch build/ui-csv
          python3 realm/warcraft/wrathpp/tools/sl_ui_art.py package build/ui-csv build/ui-cache build/art | tee -a looks-report.txt

      # The creator run on the rig (realm/warcraft/wrathpp/client-mod/rig): the game's own creation screen (the phone's
      # files), the client's creation logic, these looks' tables and that art; every race, sex and class opened, every
      # option's every choice tapped, the creator turned off, with the art, without it and with it unreadable. Neither
      # package is published if it fails.
      - name: The creator on the rig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh realm/warcraft/wrathpp/client-mod/rig/run.sh build/rig app/src/main/assets/wrathpp/WrathppCreate.lua \
            build/looks/client/Interface/GlueXML/WrathppLooks.lua build/looks/client/DBFilesClient rig-dbc/dbc build/art 2>&1 | grep -v '^ok ' | tee -a looks-report.txt
          grep -q 'the rig: all passed' looks-report.txt

      # Which of today's files each skin was made from, by name: what the app's Ralia import matches a set of replacement
      # textures by (the names are in the repository: data/skin_names.json).
      - name: The skins' names
        run: |
          python3 realm/warcraft/wrathpp/tools/sl_skin_names.py list build/looks.json realm/warcraft/wrathpp/data/skin_names.json build/looks/client/wrathpp-skins.json | tee -a looks-report.txt
          echo 'wrathpp-skins.json' >> build/looks/looks.files

      - name: The package
        run: |
          # The same files make the same zip, byte for byte (one date on every file, the files in one order, no extra
          # fields): the app downloads a package again when its checksum changes, and a zip made as it comes carries the
          # hour it was made, which sent the looks' 400 MB to the phone again after every run of this workflow.
          pack() {
            ( cd "$1" && shift && out="$1" && shift && find "$@" -exec touch -h -d '2020-01-01 00:00:00 UTC' {} + \
              && find "$@" -type f | LC_ALL=C sort | TZ=UTC zip -q -X -6 "$out" -@ )
          }
          pack build/looks "$PWD/wrathpp-looks.zip" client dbc looks.files
          size=$(stat -c %s wrathpp-looks.zip)
          sha=$(sha256sum wrathpp-looks.zip | cut -d' ' -f1)
          printf '{"size": %s, "sha256": "%s", "format": 1, "commit": "%s"}\n' "$size" "$sha" "${{ github.sha }}" > wrathpp-looks.json
          cat wrathpp-looks.json
          pack build/art "$PWD/wrathpp-creator-art.zip" client art.txt
          size=$(stat -c %s wrathpp-creator-art.zip)
          sha=$(sha256sum wrathpp-creator-art.zip | cut -d' ' -f1)
          printf '{"size": %s, "sha256": "%s", "format": 1, "commit": "%s"}\n' "$size" "$sha" "${{ github.sha }}" > wrathpp-creator-art.json
          cat wrathpp-creator-art.json
          du -sh build/looks/client build/looks/dbc | tee -a looks-report.txt
          wc -l < build/looks/looks.files | tee -a looks-report.txt

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrathpp-looks-logs
          retention-days: 14
          path: |
            looks-report.txt
            package.log
            build/looks/looks.files
            build/art/art.txt

      # Only main publishes: the app downloads whatever is published.
      - name: Publish (release wrathpp-looks)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          if ! gh release view wrathpp-looks -R "$repo" > /dev/null 2>&1; then
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/wrathpp-looks" -f sha="${{ github.sha }}" > /dev/null || true
            gh release create wrathpp-looks -R "$repo" --verify-tag --prerelease --latest=false \
              --title "Wrath++ looks: Shadowlands' ten races (experimental)" \
              --notes "Shadowlands' models, textures and character tables for the ten races of 3.3.5, for Wrath++'s copy of the game and its server. Downloaded by the app; not an app release."
          fi
          # (a package whose checksum is the published one's is left as it is: nothing for the phone to download again)
          same() { gh release download "$1" -R "$repo" -p "$1.json" -O "published-$1.json" --clobber > /dev/null 2>&1 \
            && [ "$(sed -n 's/.*"sha256": "\([0-9a-f]*\)".*/\1/p' "published-$1.json")" = "$(sed -n 's/.*"sha256": "\([0-9a-f]*\)".*/\1/p' "$1.json")" ]; }
          if same wrathpp-looks; then echo "the looks are the published ones: not uploaded"; else
            gh release upload wrathpp-looks wrathpp-looks.zip wrathpp-looks.json -R "$repo" --clobber
          fi
          if ! gh release view wrathpp-creator-art -R "$repo" > /dev/null 2>&1; then
            gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/wrathpp-creator-art" -f sha="${{ github.sha }}" > /dev/null || true
            gh release create wrathpp-creator-art -R "$repo" --verify-tag --prerelease --latest=false \
              --title "Wrath++ creator art: Shadowlands' creation screens' pieces (experimental)" \
              --notes "The pieces Shadowlands draws its character creation screens from, cut out of the game's interface sheets for Wrath++'s creator on the 3.3.5 screen. Downloaded by the app; not an app release."
          fi
          if same wrathpp-creator-art; then echo "the creator art is the published one: not uploaded"; else
            gh release upload wrathpp-creator-art wrathpp-creator-art.zip wrathpp-creator-art.json -R "$repo" --clobber
          fi
