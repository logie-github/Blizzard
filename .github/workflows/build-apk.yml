name: Build Blizzard Launcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The runner's own Android SDK.
      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - run: chmod +x gradlew
      - name: Build and test
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
          -PblizzVersionCode=${{ github.run_number }} -PblizzVersionName=1.0.${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk Blizzard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Blizzard
          path: |
            Blizzard.apk
            app/build/reports/previews/
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "blizzard-build-${{ github.run_number }}" Blizzard.apk
          --target "${{ github.sha }}" --title "Blizzard 1.0.${{ github.run_number }}"
          --notes "Install Blizzard.apk on the phone; it installs over earlier releases."
