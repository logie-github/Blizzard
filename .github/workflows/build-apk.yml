name: Build Blizzard Launcher

# Builds the launcher with the games' runtime (Winlator, scripts/prepare-winlator.sh) and the
# importers' programs (innoextract and blizzard-legacy-dl for arm64, scripts/build-tools.sh), both
# cached by their pins and patches; runs the unit tests; and on main publishes the APK as a
# release (blizzard-build-N).
on:
  push:
    branches: [main]
    # (the realm's sources and its module build have a workflow of their own)
    paths-ignore:
      - 'realm/**'
      - '.github/workflows/build-realm-modules.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blizzard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The APK and the unit tests are built side by side (they only share the compile): the release waits for both.
  build:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task: [assemble, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saving the Gradle cache takes 25 s at the end of the APK build, which the release waits for: only the APK leg writes it, and only every
          # tenth run (the run number ends in 0) (the dependencies it holds change rarely; after a change the next runs fetch them again until a save).
          cache-read-only: ${{ matrix.task == 'test' || !endsWith(format('{0}', github.run_number), '0') }}

      # The runner's own Android SDK; Winlator's native code and the tools need the NDK and CMake.
      - name: Install build tools
        # (the unit tests build no native code: only the APK leg needs the NDK and CMake)
        if: matrix.task == 'assemble'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Look for Winlator
        id: winlator
        uses: actions/cache/restore@v4
        with:
          path: app/winlator
          key: blizz-winlator-v1-${{ hashFiles('winlator-version.env', 'patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py', 'box64-version.env', 'patches/box64/**', 'scripts/build-box64.sh') }}
      # Box64 (4 minutes of cross-compiling) has a cache of its own: a change to Winlator's patches doesn't build it again.
      - name: Look for Box64
        id: box64
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/box64-cache
          key: blizz-box64-v1-${{ hashFiles('box64-version.env', 'patches/box64/**', 'scripts/build-box64.sh', 'winlator-version.env') }}
      - name: Prepare Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-zstandard patchelf zstd cmake > /dev/null
          if [ "${{ steps.box64.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu > /dev/null
          fi
          scripts/prepare-winlator.sh
      - name: Save Box64
        if: steps.winlator.outputs.cache-hit != 'true' && steps.box64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/box64-cache
          key: ${{ steps.box64.outputs.cache-primary-key }}
      - name: Save Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/winlator
          key: ${{ steps.winlator.outputs.cache-primary-key }}

      - name: Look for the importers' programs
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: app/tools
          key: blizz-tools-v1-${{ hashFiles('tools.env', 'patches/blizzard-legacy-dl/**', 'scripts/build-tools.sh', 'tools/**') }}
      - name: Build the importers' programs
        if: steps.tools.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/24.0.8215888" scripts/build-tools.sh
      - name: Save the importers' programs
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Look for Stratagus
        id: stratagus
        uses: actions/cache/restore@v4
        with:
          path: app/stratagus
          key: blizz-stratagus-v1-${{ hashFiles('stratagus.env', 'patches/stratagus/**', 'patches/stratagus-deps/**', 'scripts/build-stratagus.sh') }}
      - name: Build Stratagus (Warcraft I and II)
        if: steps.stratagus.outputs.cache-hit != 'true'
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/24.0.8215888" scripts/build-stratagus.sh
      - name: Save Stratagus
        if: steps.stratagus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/stratagus
          key: ${{ steps.stratagus.outputs.cache-primary-key }}

      - run: chmod +x gradlew
      - name: Build the APK
        if: matrix.task == 'assemble'
        env:
          # The bug reports' token (Issues: read and write on this repository), as YeaBwoi's apps carry theirs.
          BLIZZ_REPORT_TOKEN: ${{ secrets.BLIZZ_REPORT_TOKEN }}
        run: >
          ./gradlew :app:assembleDebug --no-daemon
          -PblizzVersionCode=${{ github.run_number }} -PblizzVersionName=1.0.${{ github.run_number }}
          -PblizzReportToken="$BLIZZ_REPORT_TOKEN"
      - name: Run the unit tests
        if: matrix.task == 'test'
        run: >
          ./gradlew :app:testDebugUnitTest --no-daemon -PtestForks=2
          -PblizzVersionCode=${{ github.run_number }} -PblizzVersionName=1.0.${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk Blizzard.apk
        if: matrix.task == 'assemble'
      - uses: actions/upload-artifact@v4
        if: matrix.task == 'assemble'
        with:
          name: Blizzard
          path: Blizzard.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.task == 'test' && always()
        with:
          name: previews
          path: app/build/reports/previews/
          if-no-files-found: ignore
          retention-days: 7

  # Only once the APK is built and every test has passed.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Blizzard
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "blizzard-build-${{ github.run_number }}" Blizzard.apk
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}" --title "Blizzard 1.0.${{ github.run_number }}"
          --notes "Install Blizzard.apk on the phone; it installs over earlier releases."
